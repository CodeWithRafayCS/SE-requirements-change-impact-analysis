# =========================================================================
# SEOSS 33-Project Full Dataset GPU Pipeline Configuration
# Default parameters for zero-shot dense retrieval & cross-encoder re-ranking.
# Note: CLI arguments provided to run_full_pipeline.py override these values.
# =========================================================================

paths:
  data_dir: "dataverse_files"           # Directory containing the 33 *.sqlite3 files
  output_dir: "results"                # Destination folder for CSVs, summary JSON, and plots
  cache_dir: "cache/embeddings"        # Cache directory for precomputed embeddings

hardware:
  device: "auto"                       # "auto" (uses CUDA if available, else CPU), "cuda", or "cpu"
  fp16: true                           # Mixed precision autocast for GPU matrix operations
  batch_size: 256                      # Batch size for bi-encoder embedding generation
  chunk_size: 500                      # Number of queries compared on GPU per chunk (prevents VRAM exhaustion)
  cross_batch_size: 64                 # Batch size for Stage-2 Cross-Encoder scoring

models:
  bi_encoder: "sentence-transformers/all-MiniLM-L6-v2"
  cross_encoder: "cross-encoder/ms-marco-MiniLM-L-6-v2"

retrieval:
  top_k: 20                            # Number of candidate issues retrieved per change request
  threshold: 0.5                       # Fixed decision cutoff for binary classification metrics (uncalibrated zero-shot)

evaluation:
  k_values: [1, 3, 5, 10, 20]          # Top-k budgets for Recall@K, Precision@K
  split_ratio:
    train: 0.60
    val: 0.20
    test: 0.20
  random_seed: 42
